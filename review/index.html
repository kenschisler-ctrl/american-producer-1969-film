<body><header><h1>Review stills — 19 September 2026</h1><p>The opening frame of each scene as it will go to the video model. Tap any image for the full-size version. These are not yet in the film.</p></header>
<main><figure><a href="keyframe_dawn.jpg"><img src="keyframe_dawn.jpg" alt="Scene 1 — Dawn"></a><figcaption><b>Scene 1 — Dawn</b><br>Unchanged. Card enlarged; now reads &quot;March 5, 1969&quot;.</figcaption></figure><figure><a href="keyframe_portchicago.jpg"><img src="keyframe_portchicago.jpg" alt="Scene 2 — Port Chicago"></a><figcaption><b>Scene 2 — Port Chicago</b><br>Unchanged.</figcaption></figure><figure><a href="keyframe_converging_panorama.jpg"><img src="keyframe_converging_panorama.jpg" alt="Scene 3 — Bay Bridge pan (new)"></a><figcaption><b>Scene 3 — Bay Bridge pan (new)</b><br>From the Yerba Buena end of the west span at civil dawn. The shot pans right across this: Coit Tower → Golden Gate → Alcatraz → Angel Island → the open water where she came from. Built from the 1963/1966/1970 photographs; Transamerica Pyramid removed.</figcaption></figure><figure><a href="keyframe_downbound.jpg"><img src="keyframe_downbound.jpg" alt="Scene 4 — The near miss, drone (new)"></a><figcaption><b>Scene 4 — The near miss, drone (new)</b><br>Behind and above both ships looking south-west. Producer foreground right, the M M Dant on her port side overtaking, Telegraph Hill and the piers ahead, Bay Bridge far left. Sunrise from behind the camera.</figcaption></figure><figure><a href="keyframe_producer_turn.jpg"><img src="keyframe_producer_turn.jpg" alt="Scene 5 — The near miss from the pier side (new)"></a><figcaption><b>Scene 5 — The near miss from the pier side (new)</b><br>Opening frame of the drone move: low off the pier ends, both ships bow-on against the sunrise, Producer left, Dant right. The drone then climbs over them and turns to face the pier.</figcaption></figure><figure><a href="keyframe_impact.jpg"><img src="keyframe_impact.jpg" alt="Scene 6 — Allision (new)"></a><figcaption><b>Scene 6 — Allision (new)</b><br>From a boat off the pier side, looking along the outer end. Intact ship, intact pier, two dockworkers for scale. The pier corner then cuts fifty feet into her port bow.</figcaption></figure><figure><a href="keyframe_pullback.jpg"><img src="keyframe_pullback.jpg" alt="Scene 7 — What could have been (new)"></a><figcaption><b>Scene 7 — What could have been (new)</b><br>High aerial framed like the hazard chart: piers centre, Ferry Building lower left, Bay Bridge out to Treasure Island. The blast rings are drawn over this in the film.</figcaption></figure><figure><a href="keyframe_washington.jpg"><img src="keyframe_washington.jpg" alt="Scene 8 — SS Manderson Victory (new)"></a><figcaption><b>Scene 8 — SS Manderson Victory (new)</b><br>Your father&#x27;s ship, docking just west of the Bay Bridge, crew at the rail. Built from the Navy&#x27;s photograph of the Manderson Victory.</figcaption></figure><figure><a href="keyframe_aftermath.jpg"><img src="keyframe_aftermath.jpg" alt="Scene 9 — Aftermath (new)"></a><figcaption><b>Scene 9 — Aftermath (new)</b><br>The foamed dock, the pumper, the pier still in her bow, and the tug on the line pulling her off.</figcaption></figure></main></body></html>
